name: SRS Acquiom
description: >-
  SRS Acquiom provides deal management solutions for mergers & acquisitions and
  loan agency transactions, operating across the entire deal lifecycle. Its
  services span pre-closing tax and accounting advisory, closing-phase escrow,
  payment disbursement and shareholder solicitation, and post-closing
  shareholder representation, alongside loan agency roles (administrative,
  collateral, and facility agent). SRS Acquiom delivers these through digital
  dashboards and platforms for deal transparency, backed by affiliate
  broker-dealer Acquiom Financial LLC (FINRA/SIPC). The company was surfaced as
  a portfolio company of Norwest Venture Partners. No public developer API,
  SDK, or developer portal is currently exposed.
